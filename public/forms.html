<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIAF v0.3 - Teste de Formulário & API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 29, 47, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }

    .msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: transform 0.15s ease;
    }

    .user-item:hover {
      transform: translateX(4px);
    }

    .user-info .name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .user-info .email {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .user-id {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-right: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge"><span class="status-dot"></span> LIAF v0.3 Nativo</div>
      <h1>Teste de Formulário & API</h1>
      <p class="subtitle">Entrada (POST) e Recuperação (GET) em tempo real</p>
    </header>

    <!-- Formulário de Criação -->
    <div class="card">
      <h2 class="card-title">Novo Usuário</h2>
      <div id="feedback" class="msg"></div>
      <form id="userForm">
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" placeholder="Ex: Gabriel Santos" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Ex: gabriel@exemplo.com" required autocomplete="off">
        </div>
        <button type="submit" id="submitBtn">
          Cadastrar via POST /users
        </button>
      </form>
    </div>

    <!-- Lista de Usuários Recuperados -->
    <div class="card">
      <div class="card-title">
        <span>Usuários Cadastrados</span>
        <button id="refreshBtn" style="padding: 0.4rem 0.75rem; font-size: 0.8rem; background: transparent; border: 1px solid var(--border);">Atualizar ⟳</button>
      </div>
      <div id="userList" class="user-list">
        <div class="empty-state">Carregando usuários...</div>
      </div>
    </div>
  </div>

  <script>
    const userForm = document.getElementById('userForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const feedback = document.getElementById('feedback');
    const userList = document.getElementById('userList');
    const refreshBtn = document.getElementById('refreshBtn');

    function showMessage(text, isError = false) {
      feedback.textContent = text;
      feedback.className = `msg ${isError ? 'error' : 'success'}`;
      setTimeout(() => {
        feedback.className = 'msg';
      }, 4000);
    }

    async function loadUsers() {
      try {
        const res = await fetch('/users');
        if (!res.ok) throw new Error('Falha ao buscar usuários');
        const users = await res.json();
        
        if (!users || users.length === 0) {
          userList.innerHTML = '<div class="empty-state">Nenhum usuário cadastrado ainda. Preencha o formulário acima!</div>';
          return;
        }

        userList.innerHTML = users.map(u => `
          <div class="user-item">
            <div class="user-info">
              <div class="name">${escapeHtml(u.name)}</div>
              <div class="email">${escapeHtml(u.email)}</div>
            </div>
            <span class="user-id">#${u.id}</span>
          </div>
        `).reverse().join('');
      } catch (err) {
        userList.innerHTML = `<div class="empty-state" style="color: var(--error)">Erro ao carregar dados: ${err.message}</div>`;
      }
    }

    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();

      if (!name || !email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const res = await fetch('/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erro ao cadastrar');
        }

        showMessage(`Usuário #${data.id} (${data.name}) cadastrado com sucesso!`);
        nameInput.value = '';
        emailInput.value = '';
        await loadUsers();
      } catch (err) {
        showMessage(err.message, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Cadastrar via POST /users';
      }
    });

    refreshBtn.addEventListener('click', loadUsers);

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Carregar na inicialização
    loadUsers();
  </script>
</body>
</html>
