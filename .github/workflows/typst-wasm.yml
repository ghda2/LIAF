name: Motor de documentos (WASM)

# O motor Typst vai versionado já compilado (pkg/typst/wasm/liaf_typst.wasm.gz), para que quem
# usa a LIAF não precise de Rust. Este job recompila a partir de engines/typst, no mesmo
# contêiner de `scripts/build-typst-wasm.sh --docker`, e falha se o artefato versionado não for
# exatamente o que o código-fonte produz.

on:
  push:
    paths:
      - 'engines/typst/**'
      - 'pkg/typst/wasm/**'
      - 'scripts/build-typst-wasm.sh'
      - '.github/workflows/typst-wasm.yml'
  pull_request:
    paths:
      - 'engines/typst/**'
      - 'pkg/typst/wasm/**'
      - 'scripts/build-typst-wasm.sh'
      - '.github/workflows/typst-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Recompila e compara
    runs-on: ubuntu-latest
    container: rust:1.98.1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Alvo WASI
        run: rustup target add wasm32-wasip1

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            engines/typst/target
          key: typst-wasm-${{ hashFiles('engines/typst/Cargo.lock', 'engines/typst/rust-toolchain.toml') }}

      - name: Recompila e compara com o versionado
        env:
          LIAF_WASM_OUT: ${{ runner.temp }}
        run: sh scripts/build-typst-wasm.sh --check

      - name: Publica o artefato gerado (quando difere)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liaf_typst.wasm.gz
          path: ${{ runner.temp }}/liaf_typst.wasm.gz
