<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket Live • LIAF (tw.webdrop.bio)</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --fg: #e8eaed;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #1f6feb;
    --success: #3fb950;
    --danger: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 680px; }
  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
  }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    background: rgba(88, 166, 255, 0.15);
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  h1 { font-size: 1.5rem; color: #fff; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); font-size: 0.9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  input, button {
    font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); outline: none;
  }
  input:focus { border-color: var(--accent); }
  input { flex: 1 1 160px; min-width: 0; }
  button {
    background: var(--accent-hover); border-color: var(--accent-hover);
    color: #fff; font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    font-size: 0.85rem; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    background: rgba(248, 81, 73, 0.15); color: var(--danger);
  }
  .status.connected {
    background: rgba(63, 185, 80, 0.15); color: var(--success);
  }
  #log {
    background: #090d13; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    height: 48vh; overflow-y: auto; margin-bottom: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88rem;
  }
  .ev { padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
  .ev.join { color: var(--success); font-style: italic; }
  .ev.leave { color: var(--muted); font-style: italic; }
  .ev.error { color: var(--danger); }
  .ev.msg { color: #e6edf3; }
  .ev.msg strong { color: var(--accent); }
  .ev-time { color: var(--muted); font-size: 0.75rem; margin-right: 6px; }
  .top-links { display: flex; gap: 12px; margin-top: 8px; font-size: 0.85rem; }
  .top-links a { color: var(--accent); text-decoration: none; }
  .top-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <div class="badge">LIAF v0.4 • WebSocket Nativo</div>
    <h1>tw.webdrop.bio • Real-Time WS</h1>
    <p class="sub">Canal bidirecional com salas isoladas e broadcast em sub-milissegundos.</p>
    <div class="top-links">
      <a href="/">← Voltar para Tarefas HTTP</a>
      <a href="javascript:void(0)" onclick="checkClients()">Ver Clientes Ativos</a>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <label for="room" style="color:var(--muted); font-size:0.85rem;">Sala:</label>
      <input id="room" value="geral" aria-label="Nome da Sala">
      <button id="connect">Conectar</button>
      <span class="status" id="status">desconectado</span>
      <span style="font-size:0.8rem; color:var(--muted); margin-left:auto;" id="client-count"></span>
    </div>

    <div id="log" role="log" aria-live="polite"></div>

    <div class="row">
      <input id="text" placeholder="Digite uma mensagem e tecle Enter..." aria-label="Mensagem" disabled>
      <button id="send" disabled>Enviar Mensagem</button>
    </div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let socket = null;

  function getTime() {
    const d = new Date();
    return d.toLocaleTimeString();
  }

  function append(kind, text) {
    const line = document.createElement("div");
    line.className = "ev " + kind;
    const timeSpan = document.createElement("span");
    timeSpan.className = "ev-time";
    timeSpan.textContent = `[${getTime()}]`;
    line.appendChild(timeSpan);

    const txtSpan = document.createElement("span");
    txtSpan.textContent = text;
    line.appendChild(txtSpan);

    $("log").appendChild(line);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function setConnected(on) {
    $("text").disabled = !on;
    $("send").disabled = !on;
    $("connect").textContent = on ? "Desconectar" : "Conectar";
    $("status").textContent = on ? "● conectado" : "● desconectado";
    $("status").className = "status" + (on ? " connected" : "");
    if (on) {
      $("text").focus();
      checkClients();
    } else {
      $("client-count").textContent = "";
    }
  }

  async function checkClients() {
    const room = encodeURIComponent($("room").value.trim() || "geral");
    try {
      const res = await fetch(`/rooms/${room}/size`);
      if (res.ok) {
        const data = await res.json();
        $("client-count").textContent = `(${data.clients} cliente(s) na sala)`;
      }
    } catch (e) {}
  }

  function connect() {
    const room = encodeURIComponent($("room").value.trim() || "geral");
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${scheme}://${location.host}/ws/chat/${room}`;

    append("join", `Conectando a ${wsUrl}...`);
    socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      setConnected(true);
      append("join", `Conectado com sucesso na sala [${decodeURIComponent(room)}]!`);
    };

    socket.onclose = () => {
      setConnected(false);
      socket = null;
      append("leave", "— Conexão WebSocket encerrada —");
    };

    socket.onerror = () => {
      append("error", "Erro ou falha na conexão WebSocket.");
    };

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.kind === "join") {
          append("join", `👤 ${data.text}`);
          checkClients();
        } else if (data.kind === "leave") {
          append("leave", `👋 ${data.text}`);
          checkClients();
        } else {
          append("msg", data.text);
        }
      } catch (err) {
        append("msg", event.data);
      }
    };
  }

  $("connect").onclick = () => socket ? socket.close() : connect();

  $("send").onclick = () => {
    const value = $("text").value.trim();
    if (value && socket && socket.readyState === WebSocket.OPEN) {
      socket.send(value);
      $("text").value = "";
    }
  };

  $("text").onkeydown = (e) => {
    if (e.key === "Enter") $("send").click();
  };

  // Auto-conectar ao abrir se desejar
  window.addEventListener("DOMContentLoaded", () => {
    connect();
  });
</script>
</body>
</html>
